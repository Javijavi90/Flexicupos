<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - FlexiCupos</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="page-with-nav">

    <nav class="navbar">
        <a href="index.html" class="logo">Flexi<span>Cupos</span></a>
        <div class="nav-links">
            <a href="login.html" class="nav-link-item">Iniciar sesión</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box large">
            <h2>Crear cuenta en FlexiCupos</h2>
            <div id="error-message" class="error-msg"></div>

            <div class="tabs" id="register-role-tabs">
                <div class="tab active" onclick="setTipo('cliente')"><i class="fa-regular fa-user"></i> Cliente</div>
                <div class="tab" onclick="setTipo('prestador')"><i class="fa-regular fa-star"></i> Profesional</div>
            </div>

            <form id="register-form">
                <input type="hidden" name="tipo" id="tipo_usuario" value="cliente">

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="nombre">Nombre completo</label>
                        <input type="text" id="nombre" name="nombre" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="correo">Correo electrónico</label>
                        <input type="email" id="correo" name="correo" required>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="telefono">Teléfono (WhatsApp)</label>
                        <input type="text" id="telefono" name="telefono" required>
                    </div>
                    <div class="form-group" style="flex: 1; min-width: 200px;">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                </div>

                <div id="fields_cliente">
                    <div class="form-group">
                        <label for="ubicacion">Ubicación / ciudad</label>
                        <input type="text" id="ubicacion" name="ubicacion" placeholder="Ej. Madrid, Centro">
                    </div>
                </div>

                <div id="fields_prestador" style="display: none;">
                    <div style="display: flex; gap: 1rem; flex-wrap: wrap;">
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="especialidad">Especialidad</label>
                            <input type="text" id="especialidad" name="especialidad" placeholder="Ej. Manicurista, Masajista">
                        </div>
                        <div class="form-group" style="flex: 1; min-width: 200px;">
                            <label for="direccion">Dirección o zona</label>
                            <input type="text" id="direccion" name="direccion">
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="descripcion">Descripción de tu perfil</label>
                        <textarea id="descripcion" name="descripcion" rows="3"></textarea>
                    </div>
                </div>

                <button type="submit" id="btn_submit" class="auth-btn">Registrarme como Cliente</button>
            </form>

            <div class="auth-links">
                <p>¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
                <p style="margin-top: 1rem;"><a href="index.html">← Volver al inicio</a></p>
            </div>
        </div>
    </div>

    <script src="js/auth.js"></script>
</body>
</html>
